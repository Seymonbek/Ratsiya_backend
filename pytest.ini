[pytest]
# Pytest konfiguratsiyasi
asyncio_mode = auto
# Barcha async testlar va fixture'lar BITTA event loop'da ishlaydi.
# Bu Redis/DB singleton ulanishlari bilan muammoni oldini oladi.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short -p no:cacheprovider
