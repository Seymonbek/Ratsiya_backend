[alembic]
# Migratsiya skriptlari joylashgan papka
script_location = alembic

# Loyiha root'ini sys.path'ga qo'shish — "app" modulini topish uchun
# (alembic'ni istalgan joydan ishga tushirganda ham ishlaydi)
prepend_sys_path = .

# Migratsiya fayl nomi formati
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s

# Vaqt zonasi
timezone = UTC

# Logging sozlamalari
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
